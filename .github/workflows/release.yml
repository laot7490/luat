name: Release - CLI and Language Server
run-name: Release - ${{ inputs.cli_tag || '' }}${{ inputs.lsp_tag || '' }} - ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cli_tag:
        description: CLI stable tag (v0.2.0); leave blank to skip
        type: string
        required: false
      lsp_tag:
        description: LSP stable tag (lsp-v0.1.0); leave blank to skip
        type: string
        required: false

permissions:
  contents: read

jobs:
  resolve-release:
    name: Resolve product versions and source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      cli_tag: ${{ steps.resolve.outputs.cli_tag }}
      lsp_tag: ${{ steps.resolve.outputs.lsp_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Resolve immutable source and release decisions
        id: resolve
        run: node scripts/release.mjs resolve

  verify:
    name: Verify selected source
    needs: resolve-release
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.resolve-release.outputs.source_sha }}

  release-cli:
    name: Release CLI
    needs: [resolve-release, verify]
    if: needs.resolve-release.outputs.cli_tag != ''
    permissions:
      contents: write
      actions: read
      id-token: write
    uses: ./.github/workflows/release-cli.yml
    with:
      source_sha: ${{ needs.resolve-release.outputs.source_sha }}
      release_tag: ${{ needs.resolve-release.outputs.cli_tag }}

  release-lsp:
    name: Release Language Server and VS Code
    needs: [resolve-release, verify]
    if: needs.resolve-release.outputs.lsp_tag != ''
    permissions:
      contents: write
      actions: read
      id-token: write
    uses: ./.github/workflows/release-lsp.yml
    with:
      source_sha: ${{ needs.resolve-release.outputs.source_sha }}
      release_tag: ${{ needs.resolve-release.outputs.lsp_tag }}
