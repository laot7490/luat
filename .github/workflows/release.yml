name: Release - CLI and Language Server
run-name: Release - ${{ inputs.product || 'changed products' }} - ${{ inputs.release_tag || github.sha }}

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      product:
        description: Product to release or recover from an existing tag
        type: choice
        options: [cli, lsp]
        required: true
      release_tag:
        description: Stable release tag (v0.2.0 or lsp-v0.1.0)
        type: string
        required: true

permissions:
  contents: read

jobs:
  resolve-release:
    name: Resolve product versions and source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      cli_tag: ${{ steps.resolve.outputs.cli_tag }}
      lsp_tag: ${{ steps.resolve.outputs.lsp_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Resolve immutable source and release decisions
        id: resolve
        run: node scripts/release.mjs resolve

  verify:
    name: Verify selected source
    needs: resolve-release
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.resolve-release.outputs.source_sha }}

  release-cli:
    name: Release CLI
    needs: [resolve-release, verify]
    if: needs.resolve-release.outputs.cli_tag != ''
    permissions:
      contents: write
      actions: read
      id-token: write
    uses: ./.github/workflows/release-cli.yml
    with:
      source_sha: ${{ needs.resolve-release.outputs.source_sha }}
      release_tag: ${{ needs.resolve-release.outputs.cli_tag }}

  release-lsp:
    name: Release Language Server and VS Code
    needs: [resolve-release, verify]
    if: needs.resolve-release.outputs.lsp_tag != ''
    permissions:
      contents: write
      actions: read
      id-token: write
    uses: ./.github/workflows/release-lsp.yml
    with:
      source_sha: ${{ needs.resolve-release.outputs.source_sha }}
      release_tag: ${{ needs.resolve-release.outputs.lsp_tag }}
