name: Release LuaT

on:
  workflow_dispatch:
  release:
    types: [published]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            package: luat-win32-x64
            executable: luat.exe
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            package: luat-linux-x64
            executable: luat
            cross: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            package: luat-linux-arm64
            executable: luat
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            package: luat-darwin-x64
            executable: luat
          - target: aarch64-apple-darwin
            runner: macos-latest
            package: luat-darwin-arm64
            executable: luat
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.cross
        uses: taiki-e/install-action@cross
      - if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }}
      - if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: target/${{ matrix.target }}/release/${{ matrix.executable }}
          if-no-files-found: error

  publish:
    if: github.event_name == 'release' || github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@latest
      - uses: actions/download-artifact@v4
        with:
          path: .release-artifacts
      - name: Prepare packages
        run: |
          node scripts/sync-versions.mjs
          cp README.md packages/luat/README.md
          mkdir -p packages/luat-win32-x64/bin packages/luat-linux-x64/bin packages/luat-linux-arm64/bin packages/luat-darwin-x64/bin packages/luat-darwin-arm64/bin
          cp .release-artifacts/luat-win32-x64/luat.exe packages/luat-win32-x64/bin/luat.exe
          cp .release-artifacts/luat-linux-x64/luat packages/luat-linux-x64/bin/luat
          cp .release-artifacts/luat-linux-arm64/luat packages/luat-linux-arm64/bin/luat
          cp .release-artifacts/luat-darwin-x64/luat packages/luat-darwin-x64/bin/luat
          cp .release-artifacts/luat-darwin-arm64/luat packages/luat-darwin-arm64/bin/luat
          chmod +x packages/luat-linux-x64/bin/luat packages/luat-linux-arm64/bin/luat packages/luat-darwin-x64/bin/luat packages/luat-darwin-arm64/bin/luat
      - name: Verify package metadata and license
        run: |
          for binary in packages/luat-win32-x64/bin/luat.exe packages/luat-linux-x64/bin/luat packages/luat-linux-arm64/bin/luat packages/luat-darwin-x64/bin/luat packages/luat-darwin-arm64/bin/luat; do
            test -s "$binary"
          done
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          const cargo = readFileSync('Cargo.toml', 'utf8');
          const version = cargo.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          const license = cargo.match(/^license\s*=\s*"([^"]+)"/m)?.[1];
          if (!license || !existsSync('LICENSE')) throw new Error('Choose a license, add LICENSE, and set Cargo.toml license before publishing.');
          for (const name of ['@luatlang/cli', 'luat-win32-x64', 'luat-linux-x64', 'luat-linux-arm64', 'luat-darwin-x64', 'luat-darwin-arm64']) {
            const directory = name === '@luatlang/cli' ? 'luat' : name;
            const pkg = JSON.parse(readFileSync(`packages/${directory}/package.json`, 'utf8'));
            if (pkg.version !== version || pkg.license !== license) throw new Error(`${name} package version/license does not match Cargo.toml.`);
          }
          NODE
      - name: Publish platform packages and CLI
        run: |
          for package in luat-win32-x64 luat-linux-x64 luat-linux-arm64 luat-darwin-x64 luat-darwin-arm64; do
            npm publish "./packages/$package" --access public --provenance
          done
          npm publish ./packages/luat --access public --provenance

  attach-release-assets:
    if: github.event_name == 'release' || github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: .release-artifacts
      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p target/release-assets
          for package in luat-win32-x64 luat-linux-x64 luat-linux-arm64 luat-darwin-x64 luat-darwin-arm64; do
            executable=luat
            if [ "$package" = luat-win32-x64 ]; then
              executable=luat.exe
            else
              chmod +x ".release-artifacts/$package/$executable"
            fi
            asset="target/release-assets/$package.tar.gz"
            test -s ".release-artifacts/$package/$executable"
            tar --mode=755 -czf "$asset" -C ".release-artifacts/$package" "$executable"
            tar -tzf "$asset" >/dev/null
          done
      - name: Attach archives to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" target/release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
