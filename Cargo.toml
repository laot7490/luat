[package]
name = "luat"
version = "0.7.2"
edition = "2024"
description = "A typed Lua compiler targeting CfxLua."
license = "MIT"

[workspace]
members = [".", "lsp"]
resolver = "3"

[lib]
name = "luat"
path = "src/lib.rs"

[[bin]]
name = "luat"
path = "src/main.rs"

[dependencies]
full_moon = { version = "3.0.0", features = ["cfxlua", "luau"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.2"
glob = "0.3"
stylua_lib = { package = "stylua", version = "2.6", default-features = false, features = ["cfxlua", "luau"] }
unicode-width = "0.2"
notify = "8.2"
ureq = "3"
semver = "1"
sha2 = "0.11"
toml_edit = "0.25"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_SystemInformation"] }
